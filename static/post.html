<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>富邦悍將球迷論壇 - 文章內容</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script type="module" src="./blog.js"></script> 
  <script type="module" src="./auth.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
    }

    /* 動態漸層背景 */
    .hero-gradient {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #60a5fa 100%);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 背景紋理 */
    .texture {
      background-image: url('https://www.transparenttextures.com/patterns/football-noise.png');
      background-repeat: repeat;
      opacity: 0.15;
    }

    /* 光暈標題 */
    .glow-text {
      text-shadow: 0 0 25px rgba(96, 165, 250, 0.7);
    }
    
    /* 按鈕啟用狀態 */
    .sidebar-btn.active {
      background-color: white;
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }
    .sidebar-btn.active[data-action="likes"] {
      color: #ec4899; /* pink-500 */
    }
    .sidebar-btn.active[data-action="comments"] {
      color: #3b82f6; /* blue-500 */
    }
    
    /* 按鈕點擊時的瞬間回饋 */
    .sidebar-btn:active {
      transform: scale(0.95);
      transition-duration: 100ms;
    }
    
    /* Tooltip 容器 */
    .tooltip-container {
      position: relative;
    }

    /* Tooltip 文字樣式 */
    .tooltip-text {
      visibility: hidden;
      opacity: 0;
      width: 120px;
      background-color: #1e3a8a; /* blue-900 */
      color: #fff;
      text-align: center;
      border-radius: 6px;
      padding: 5px 0;
      position: absolute;
      z-index: 1;
      bottom: 125%; /* Position the tooltip above the button */
      left: 50%;
      margin-left: -60px; /* Use half of the width to center the tooltip */
      transition: opacity 0.3s;
    }

    /* 當滑鼠懸停在容器上時，顯示 Tooltip */
    .tooltip-container:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(96, 165, 250, 0.5);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(96, 165, 250, 0.8);
    }
  </style>
</head>

<body class="bg-gray-950 text-white">
  <div class="hero-gradient min-h-screen relative overflow-hidden flex flex-col">
    <div class="absolute inset-0 texture pointer-events-none"></div>

    <header class="container mx-auto px-6 py-6 flex items-center justify-between relative z-10">
      <div class="flex items-center space-x-4">
        <a href="index.html" class="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-lg overflow-hidden">
          <img src="img/logo.jpg" alt="富邦悍將Logo" class="w-full h-full object-cover">
        </a>
        <h1 class="text-2xl font-black tracking-wide">富邦悍將球迷論壇</h1>
      </div>
      <nav class="hidden md:flex space-x-8 text-blue-100 font-medium items-center">
        <a href="index.html" class="hover:text-yellow-400 transition">🏠 首頁</a>
        <a href="blog.html" class="text-yellow-400 font-bold">📄 文章列表</a>
        <a href="#" class="hover:text-yellow-400 transition">📰關於我們</a>

        <div id="auth-links" class="flex items-center space-x-4">
            <a href="login.html" class="bg-blue-500/80 hover:bg-blue-600 px-4 py-2 rounded-full transition">登入</a>
            <a href="/register.html" class="bg-yellow-400/80 hover:bg-yellow-500 text-blue-900 px-4 py-2 rounded-full transition">註冊</a>
        </div>
        <div id="user-info" class="hidden items-center space-x-4">
            <span id="welcome-message" class="font-bold"></span>
            <button id="logout-btn" class="bg-red-500/80 hover:bg-red-600 px-4 py-2 rounded-full transition">登出</button>
        </div>
      </nav>
    </header>

    <main class="relative z-10 container mx-auto px-6 py-12 max-w-6xl flex-grow">
      <h2 class="text-4xl md:text-5xl font-black text-center mb-10 glow-text">📖 文章內容</h2>

      <div id="content" class="flex flex-col md:flex-row gap-8">
        <div id="article-wrapper"
             class="flex-grow md:w-2/3 rounded-2xl border border-white/20 bg-white/10 backdrop-blur-md p-8 shadow-lg
                    overflow-y-auto max-h-[calc(100vh-15rem)] custom-scrollbar">
          <div class="text-blue-200">載入中…</div>
        </div>

        <aside id="sidebar-content"
               class="md:w-1/3 rounded-2xl border border-white/20 bg-white/10 backdrop-blur-md p-6 shadow-lg
                      overflow-y-auto max-h-[calc(100vh-15rem)] custom-scrollbar">
        </aside>
      </div>
    </main>

    <footer class="bg-gray-900/70 backdrop-blur-sm border-t border-blue-800 py-6 text-center text-blue-200 text-sm relative z-10">
      <p>
        本論壇為球迷自發性建立，與富邦悍將球團無直接關聯<br/>
        © 2025 富邦悍將球迷論壇 | 悍將精神，永不熄滅 ⚔️
      </p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script type="module" src="./post.js"></script>
</body>
</html>
